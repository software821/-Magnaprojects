# Boulevard landing site — Netlify config.
# Static HTML + JS for the public site, plus a small Netlify Functions
# backend that powers the /admin review dashboard (talks to Supabase).

[build]
  publish = "."
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# CANONICAL URLS — strip .html so /articles/foo and /privacy-policy work.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

# TikTok URL-prefix verification — TikTok requires the file at /terms/<name>.txt
# because we registered /terms as the ToS URL. The file lives at the publish
# root; this rewrite exposes it under the /terms/ prefix without creating a
# real /terms/ directory (which would collide with the /terms pretty URL).
[[redirects]]
  from = "/terms/tiktokCc9zfLw5Ooa8GuLxzQPCJGj03banL25e.txt"
  to = "/tiktokCc9zfLw5Ooa8GuLxzQPCJGj03banL25e.txt"
  status = 200
  force = true

# Same TikTok URL-prefix trick for the privacy-policy URL.
[[redirects]]
  from = "/privacy-policy/tiktokPVZxgwZolBPFnUd6IO5M0hZLzewQFhes.txt"
  to = "/tiktokPVZxgwZolBPFnUd6IO5M0hZLzewQFhes.txt"
  status = 200
  force = true

[[redirects]]
  from = "/delete-account.html"
  to = "/delete-account"
  status = 301
  force = true

# Articles — clean URLs without .html (e.g. /articles/spotify-alternatives-2026).
[[redirects]]
  from = "/articles/"
  to = "/articles/index.html"
  status = 200

[[redirects]]
  from = "/articles"
  to = "/articles/index.html"
  status = 200

[[redirects]]
  from = "/articles/:slug"
  to = "/articles/:slug.html"
  status = 200

# Admin dashboard — single-page tool at /admin (rewrite, not redirect).
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Web app (Expo build) — served at /app on the same domain. SPA fallback:
# any /app/* path that is not a real file serves the app's index.html. Real
# assets (/app/_expo/*, /app/assets/*) are served directly because Netlify
# serves existing files before applying a non-forced 200 rewrite.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# ---------------------------------------------------------------------------
# API → Netlify Functions
# The /admin dashboard hits /api/queue-stats, /api/archetypes, /api/review,
# and /api/songs/:id/:action. Route them to functions.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/api/queue-stats"
  to = "/.netlify/functions/queue-stats"
  status = 200

[[redirects]]
  from = "/api/archetypes"
  to = "/.netlify/functions/archetypes"
  status = 200

[[redirects]]
  from = "/api/review"
  to = "/.netlify/functions/review"
  status = 200

# All song mutating actions go to a single function that reads :action from
# the path (approve/reject/regenerate/rate).
[[redirects]]
  from = "/api/songs/:id/:action"
  to = "/.netlify/functions/songs-action"
  status = 200

# Admin auth + team management. The /admin SPA signs users in via Supabase
# Auth (email/password + Google) and the functions verify the JWT against
# the public.admin_users allowlist.
[[redirects]]
  from = "/api/admin/config"
  to = "/.netlify/functions/admin-config"
  status = 200

[[redirects]]
  from = "/api/admin/me"
  to = "/.netlify/functions/admin-me"
  status = 200

[[redirects]]
  from = "/api/admin/team"
  to = "/.netlify/functions/admin-team"
  status = 200

[[redirects]]
  from = "/api/admin/team/:id"
  to = "/.netlify/functions/admin-team"
  status = 200

# ---------------------------------------------------------------------------
# SECURITY + CACHE HEADERS
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Don't let crawlers index the admin tool.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# styles.css is not content-hashed, so it must NOT be immutable —
# browsers would otherwise pin a stale copy for a year on every visitor.
# max-age=0 + must-revalidate keeps the file cached but forces a 304
# revalidation on every page load. CSS updates ship instantly.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Favicons + icons + OG image — safe to cache for a year (content-stable).
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Article HTML — revalidate so edits ship instantly.
[[headers]]
  for = "/articles/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
